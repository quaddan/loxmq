version: 2
updates:
  # Maven dependencies — Quarkus BOM, HiveMQ Client, Jackson, Vert.x, etc.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - maven
    groups:
      # Minor + patch bumps arrive as ONE PR (checked daily); majors stay separate so you can
      # review them individually (e.g. a Quarkus platform major — trigger the
      # SECURITY.md re-scan when that lands).
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      # All GitHub Actions bumps in a single PR (today: checkout + setup-java).
      github-actions:
        patterns:
          - "*"
