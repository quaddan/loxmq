name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests (-Pintegration) are NOT run in CI: they exercise the
      # live Loxone Miniserver + MQTT broker, which live on a private LAN and
      # are unreachable from GitHub-hosted runners. `./mvnw verify` keeps the unit
      # tests + quality gates (spotless, enforcer) and skips ITs (skipITs=true
      # by default in the pom). Run ITs locally with `./mvnw verify -Pintegration`.
      #
      # Uses the Maven wrapper (./mvnw, pinned to the version in
      # .mvn/wrapper/maven-wrapper.properties) rather than the runner's system
      # `mvn`, so the build is deterministic and the enforcer requireMavenVersion
      # rule always sees the intended Maven. Retried once to ride out
      # environmental flakes (Testcontainers/Ryuk startup, transient network) —
      # a genuine failure still fails both attempts and turns the job red.
      - name: Build + unit tests
        run: |
          for attempt in 1 2; do
            echo "::group::mvnw verify (attempt $attempt)"
            if ./mvnw -B -ntp verify; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::mvnw verify failed on attempt $attempt"
          done
          exit 1
