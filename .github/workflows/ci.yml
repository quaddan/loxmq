name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests (-Pintegration) are NOT run in CI: they exercise the
      # live Loxone Miniserver + MQTT broker, which live on a private LAN and
      # are unreachable from GitHub-hosted runners. `mvn verify` keeps the unit
      # tests + quality gates (spotless, enforcer) and skips ITs (skipITs=true
      # by default in the pom). Run ITs locally with `mvn verify -Pintegration`.
      - name: Build + unit tests
        run: mvn -B -ntp verify
