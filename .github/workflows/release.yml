# ============================================================================
# Release — build and publish container images to Docker Hub
# (docker.io/quaddan/loxmq), sync the Hub repo description from
# docker/DOCKERHUB.md, and — on version tags — publish a GitHub Release
# with downloadable assets:
#
#   loxmq-<v>-jvm.zip          fast-jar (any OS, Java 25)
#   loxmq-<v>-linux-amd64      native binary (prod profile baked in)
#   env.example                configuration template
#   loxmq-{jvm,native}.service systemd units
#   SHA256SUMS.txt             checksums
#
# Release notes are extracted from the matching `## [<v>]` CHANGELOG section,
# so write the CHANGELOG entry BEFORE pushing the tag.
#
# Prerequisites — repo Settings > Secrets and variables > Actions > Secrets:
#   DOCKERHUB_USERNAME  Docker Hub username (quaddan)
#   DOCKERHUB_TOKEN     Docker Hub access token, Read & Write scope
#                       (hub.docker.com > Account settings > Personal access tokens)
# The GitHub Release job needs no extra secret (uses the built-in GITHUB_TOKEN).
#
# Two flavours, published side by side so third-party users pick what fits
# their host (see docker/README.md):
#
#   :jvm    — Temurin 25 fast-jar (docker/Dockerfile.jvm). MULTI-ARCH
#             (linux/amd64 + linux/arm64): the jar is architecture-neutral, so
#             the same image runs on x86-64 servers AND ARM boxes (Raspberry Pi,
#             Apple-silicon Docker, ARM NAS). This is the `:latest` alias.
#   :native — GraalVM native binary (docker/Dockerfile.debian). linux/amd64
#             ONLY: the native runner is compiled per-architecture and we build
#             on an x86-64 runner. ARM users should run :jvm.
#
# Tag scheme (computed by docker/metadata-action from the git tag vMAJOR.MINOR.RELEASE):
#   push tag v1.2.3  →  :jvm  :latest  :1.2.3-jvm  :1.2-jvm
#                       :native        :1.2.3-native  :1.2-native
#   workflow_dispatch (no git tag) → only the moving :jvm / :latest / :native tags.
#
# The native build is delegated to the Mandrel builder CONTAINER
# (-Dquarkus.native.container-build=true) so the runner needs no local GraalVM —
# same path documented in native-it.yml.
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: quaddan/loxmq

jobs:
  jvm:
    name: JVM image (multi-arch, :jvm + :latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # fast-jar layout under target/quarkus-app/ — COPYed by docker/Dockerfile.jvm.
      - name: Build fast-jar
        run: mvn -B -ntp package -DskipTests

      # Hand the fast-jar to the github-release job (tag builds only).
      - name: Package fast-jar zip for the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd target && zip -qr "loxmq-${GITHUB_REF_NAME#v}-jvm.zip" quarkus-app/

      - name: Upload fast-jar artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: jvm-zip
          path: target/loxmq-*-jvm.zip
          retention-days: 1
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=jvm
            type=raw,value=latest
            type=semver,pattern={{version}},suffix=-jvm
            type=semver,pattern={{major}}.{{minor}},suffix=-jvm

      - name: Build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  native:
    name: Native image (amd64, :native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Native runner via the Mandrel builder container — no local GraalVM needed.
      # Produces target/<artifactId>-<version>-runner, COPYed by docker/Dockerfile.debian.
      - name: Build native runner
        run: mvn -B -ntp package -Pnative -DskipTests -Dquarkus.native.container-build=true

      # Hand the binary to the github-release job (tag builds only). CI target/
      # is always fresh, so the glob matches exactly one runner.
      - name: Stage native binary for the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp target/*-runner "target/loxmq-${GITHUB_REF_NAME#v}-linux-amd64"

      - name: Upload native binary artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: native-binary
          path: target/loxmq-*-linux-amd64
          retention-days: 1
          if-no-files-found: error

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=native
            type=semver,pattern={{version}},suffix=-native
            type=semver,pattern={{major}}.{{minor}},suffix=-native

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: [ jvm, native ]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Push docker/DOCKERHUB.md as the Hub repo overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: quaddan/loxmq
          readme-filepath: docker/DOCKERHUB.md

  github-release:
    name: GitHub Release (assets + notes)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ jvm, native ]
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          # Only our two release artifacts — NOT the *.dockerbuild provenance
          # artifacts that docker/build-push-action uploads automatically
          # (downloading those broke this step and would land as junk assets).
          pattern: "{jvm-zip,native-binary}"
          merge-multiple: true

      - name: Assemble assets (env template, systemd units, checksums)
        run: |
          cp .env.example dist/env.example
          cp service/loxmq-jvm.service service/loxmq-native.service dist/
          cd dist
          sha256sum * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt .
          ls -la

      # Notes = this version's CHANGELOG section + a fixed assets/Docker footer.
      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Stop at the next "## [" section OR at the link-reference block at
          # the end of the file ("[1.0.1]: https://…") — the last section would
          # otherwise drag those definitions into the notes.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ || /^\[[^]]+\]: / {flag=0}
            flag' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "_See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)._" > /tmp/notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Docker images:** \`docker pull quaddan/loxmq:${VERSION}-native\` (x86-64) or \`:${VERSION}-jvm\` (incl. ARM) — [Docker Hub](https://hub.docker.com/r/quaddan/loxmq) · [docker/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docker/README.md)"
            echo ""
            echo "**Downloads below:** fast-jar zip (any OS, Java 25) · native Linux x86-64 binary (\`prod\` profile baked in) · \`env.example\` config template · systemd units ([INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/INSTALL.md)) · \`SHA256SUMS.txt\`"
          } >> /tmp/notes.md

      - name: Create the release (or refresh assets on re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest \
              --title "loxmq ${GITHUB_REF_NAME#v}" \
              --notes-file /tmp/notes.md
          fi
