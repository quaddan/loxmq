# ============================================================================
# Release — build and publish container images to Docker Hub
# (docker.io/quaddan/loxmq) and sync the Hub repo description from
# docker/DOCKERHUB.md.
#
# Prerequisites — repo Settings > Secrets and variables > Actions > Secrets:
#   DOCKERHUB_USERNAME  Docker Hub username (quaddan)
#   DOCKERHUB_TOKEN     Docker Hub access token, Read & Write scope
#                       (hub.docker.com > Account settings > Personal access tokens)
#
# Two flavours, published side by side so third-party users pick what fits
# their host (see docker/README.md):
#
#   :jvm    — Temurin 25 fast-jar (docker/Dockerfile.jvm). MULTI-ARCH
#             (linux/amd64 + linux/arm64): the jar is architecture-neutral, so
#             the same image runs on x86-64 servers AND ARM boxes (Raspberry Pi,
#             Apple-silicon Docker, ARM NAS). This is the `:latest` alias.
#   :native — GraalVM native binary (docker/Dockerfile.debian). linux/amd64
#             ONLY: the native runner is compiled per-architecture and we build
#             on an x86-64 runner. ARM users should run :jvm.
#
# Tag scheme (computed by docker/metadata-action from the git tag vMAJOR.MINOR.RELEASE):
#   push tag v1.2.3  →  :jvm  :latest  :1.2.3-jvm  :1.2-jvm
#                       :native        :1.2.3-native  :1.2-native
#   workflow_dispatch (no git tag) → only the moving :jvm / :latest / :native tags.
#
# The native build is delegated to the Mandrel builder CONTAINER
# (-Dquarkus.native.container-build=true) so the runner needs no local GraalVM —
# same path documented in native-it.yml.
# ============================================================================

name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: quaddan/loxmq

jobs:
  jvm:
    name: JVM image (multi-arch, :jvm + :latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # fast-jar layout under target/quarkus-app/ — COPYed by docker/Dockerfile.jvm.
      - name: Build fast-jar
        run: mvn -B -ntp package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=jvm
            type=raw,value=latest
            type=semver,pattern={{version}},suffix=-jvm
            type=semver,pattern={{major}}.{{minor}},suffix=-jvm

      - name: Build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  native:
    name: Native image (amd64, :native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Native runner via the Mandrel builder container — no local GraalVM needed.
      # Produces target/<artifactId>-<version>-runner, COPYed by docker/Dockerfile.debian.
      - name: Build native runner
        run: mvn -B -ntp package -Pnative -DskipTests -Dquarkus.native.container-build=true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=native
            type=semver,pattern={{version}},suffix=-native
            type=semver,pattern={{major}}.{{minor}},suffix=-native

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: [ jvm, native ]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Push docker/DOCKERHUB.md as the Hub repo overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: quaddan/loxmq
          readme-filepath: docker/DOCKERHUB.md
