      <rect x="700" y="224" width="140" height="64" rx="6" fill="#1f2430" stroke="#1f2430" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="708" y="232" width="48" height="12" rx="2" fill="none" stroke="#1f2430" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="732" y="241" fill="#5a6472" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROKER</text>
