      <rect x="896" y="224" width="136" height="64" rx="6" fill="#faf9f7"/>
      <rect x="896" y="224" width="136" height="64" rx="6" fill="#5a6472" stroke="#5a6472" stroke-width="1" fill-opacity="0.10"/>
      <rect x="904" y="232" width="30" height="12" rx="2" fill="none" stroke="#5a6472" stroke-width="0.8" stroke-opacity="0.45"/>
