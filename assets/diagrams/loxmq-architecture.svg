      <text x="40" y="446" fill="#5a6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="140" y="440" width="14" height="10" rx="2" fill="#06b6d4" stroke="#06b6d4" stroke-width="1.1" stroke-dasharray="3,2" fill-opacity="0.04"/>
      <text x="160" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">loxmq boundary</text>

      <rect x="288" y="440" width="14" height="10" rx="2" fill="#5a6472" stroke="#5a6472" stroke-width="1" fill-opacity="0.10"/>
      <text x="308" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">External / user</text>

      <rect x="420" y="440" width="14" height="10" rx="2" fill="#ffffff" stroke="#1f2430" stroke-width="1"/>
      <text x="440" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

      <rect x="520" y="440" width="14" height="10" rx="2" fill="#1f2430" stroke="#5a6472" stroke-width="1" fill-opacity="0.05"/>
      <text x="540" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <line x1="612" y1="445" x2="640" y2="445" stroke="#06b6d4" stroke-width="1.6" marker-end="url(#loxmq-architecture-arrow-accent)"/>
      <text x="648" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">Encrypted WS</text>

      <line x1="760" y1="445" x2="788" y2="445" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#loxmq-architecture-arrow-link)"/>
      <text x="796" y="448" fill="#5a6472" font-size="8.5" font-family="'Geist', sans-serif">MQTT / HTTP</text>

