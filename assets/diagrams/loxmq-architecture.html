  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --color-muted:  #5a6472;
      --color-accent: #06b6d4;

      --font-mono:  'Geist Mono', ui-monospace, monospace;

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    .svg-wrap { overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>

    <h1>loxmq — Loxone Miniserver ↔ MQTT v5 bridge</h1>
